<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card game</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-container">
      <!-- ===========================
            PLAYER 1 CARD AREA
            ===========================  -->
      <section class="player1-box computer--box" aria-label="Computer hand">
        <!-- Player 1 info  -->
        <div class="computer-textinfo">
          <span class="name">COMPUTER</span>
          <span class="name" aria-label="separator">-</span>
          <span class="score">0</span>
        </div>

        <!-- Player 1 card hand set -->
        <div class="hand-cards"></div>
      </section>

      <!-- ===========================
            BATTLE ARENA
            ===========================  -->
      <section class="battle-arena" aria-label="Battle Arena">
        <button id="start-button">Start</button>
        <div class="battle-arena-section">
          <div class="card card-pile">
            <div class="card-back"></div>
            <span class="shuffle-card">Card Deck</span>
          </div>
          <div class="computer-slot"></div>

          <span class="vs-text">VS</span>
          <div class="user-slot"></div>
        </div>
      </section>

      <!-- ===========================
            PLAYER 2 CARD AREA
            ===========================  -->
      <section class="player2-box user--box" aria-label="User hand">
        <!-- Player 2 info  -->
        <div class="user-textinfo">
          <span class="name">USER </span>
          <span class="name" aria-label="separator">-</span>
          <span class="score">0</span>
        </div>
        <!-- Player 2 card hand set -->
        <div class="hand-cards"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
